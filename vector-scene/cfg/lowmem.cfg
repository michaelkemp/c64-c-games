# Same as hires-bounce/cfg/lowmem.cfg, plus one change: the ZP segment
# is grown from cc65's stock 26 bytes ($0002-$001B) to 96 bytes
# ($0002-$0061), to fit src/drawline_asm.s's ~30 bytes of hand-placed
# zero-page state (ptr/mask/err/e2/dx/dy/...) alongside cc65's own
# runtime-reserved zp pointers. $0002-$0061 stays well clear of the
# $90+ zero-page bytes the KERNAL/BASIC use, so this is safe even though
# we don't disable interrupts for the whole program (only around each
# timed benchmark section).
#
# Same as cc65's stock c64.cfg otherwise, except __HIMEM__ is lowered
# from $D000 to $3F00 (was $4000 -- see below for the extra $100). See
# README.md's "Why a custom linker config" for the reason: the stock
# config lets cc65 place code/data anywhere from $0801 up to $D000,
# which would happily overlap the $4000-$7FFF window this program POKEs
# VIC bank 1's screen matrix and bitmap into by fixed address. Capping
# __HIMEM__ keeps every cc65-managed byte (code, data, the software
# stack) below that window, so nothing the linker places can ever
# collide with memory the VIC-II is reading as graphics.
#
# __HIMEM__ is $3F00, not $4000, to carve out SCRATCH ($3F00-$3FFF, see
# MEMORY below) -- a fixed, genuinely reserved 256 bytes for benchmarks
# to POKE automated results into (tests/bench_report.h and others) for
# tools/bench.sh's VICE-remote-monitor readback, instead of a bare
# "$2000 is probably empty" guess. That guess was wrong at least once:
# tests/bench_angle_sweep.c links two full asm modules plus a 720-byte
# table, and its own compiled code+rodata+data ran from roughly
# $080D-$2094 -- meaning "scratch" writes at $2000-$208F were landing
# INSIDE the running program's own code/data segment, not on empty
# RAM. That produced genuinely intermittent, build-dependent-looking
# "measurement anomalies" (wildly wrong cycle counts at whichever
# angle happened to line up with whatever got overwritten) that looked
# like real bugs in the code being measured until traced back here.
# Lowering __HIMEM__ makes ld65 itself refuse to link (MAIN/BSS
# overflow) if a program ever grows large enough to threaten SCRATCH,
# rather than silently corrupting it.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $3F00; # was $D000 in the stock cfg, $4000 before SCRATCH
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $0060;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    SCRATCH:  file = "", define = yes, start = $3F00,            size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
